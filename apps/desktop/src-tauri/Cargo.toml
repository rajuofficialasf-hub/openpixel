[package]
name = "openpixel-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "OpenPixel Engine desktop application — Tauri 2 frontend over openpixel-core (Phase 8)"

# Detached workspace: this crate is deliberately NOT a member of the
# root workspace (see docs/DESKTOP.md). Tauri 2 pulls a GUI toolkit
# (WebKitGTK/GTK on Linux) plus an async runtime into the build; making
# it a root member would make `cargo test --workspace` link the GUI
# libraries and compile the whole Tauri tree for every engine test run.
# It has its own lockfile and its own commands:
#   cargo check -p openpixel-desktop --manifest-path apps/desktop/src-tauri/Cargo.toml
#   cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
[workspace]

[lib]
name = "openpixel_desktop"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "openpixel-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[features]
# Default build (Linux desktop): native OCR on. The `native-ocr`
# feature only forwards to openpixel-ocr — the code in
# pdf_commands.rs is cfg-gated on it, so `--no-default-features`
# (the Android path) compiles with honest "OCR unavailable"
# stubs instead of failing on the missing Tesseract exports.
# See docs/DESKTOP.md "Android notes".
default = ["native-ocr"]
native-ocr = ["openpixel-ocr/native-ocr"]

[dependencies]
# Pinned exactly, like the rest of the engine (see docs/CODECS.md).
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
openpixel-core = { path = "../../../crates/openpixel-core", version = "=0.1.0", default-features = false }
openpixel-formats = { path = "../../../crates/openpixel-formats", version = "=0.1.0" }
openpixel-jobs = { path = "../../../crates/openpixel-jobs", version = "=0.1.0" }
# Studio Phase 7: PDF / OCR / document engines. openpixel-pdf has
# the `pdfium` feature ON (Phase 8: the desktop bundle ships
# libpdfium as a Tauri resource, so rendering and PDFium text
# extraction work out of the box; the resolver in
# crates/openpixel-pdf/src/render.rs finds it in the Tauri resource
# dir).
# openpixel-ocr enables `native-ocr` (Tesseract — needs
# libtesseract + tessdata at build and runtime, see docs/OCR.md).
# NOTE on openpixel-core `default-features = false` (Android):
# it only removes dav1d-sys from the tree if EVERY consumer does
# the same — openpixel-jobs still enables the core defaults, so
# feature unification re-enables native-avif for this build (the
# desktop keeps AVIF decode). Removing dav1d for Android needs
# the workspace-level jobs change; see docs/DESKTOP.md.
openpixel-pdf = { path = "../../../crates/openpixel-pdf", version = "=0.1.0", features = ["pdfium"] }
openpixel-ocr = { path = "../../../crates/openpixel-ocr", version = "=0.1.0" }
openpixel-documents = { path = "../../../crates/openpixel-documents", version = "=0.1.0" }

[dev-dependencies]
# Fixture generation in tests only (same pinned version as the workspace).
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
lopdf = "=0.47.0"
tempfile = "=3.27.0"
