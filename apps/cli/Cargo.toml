[package]
name = "openpixel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenPixel CLI — info, convert, formats, capabilities (Phase 1)"

[[bin]]
name = "openpixel"
path = "src/main.rs"

[dependencies]
openpixel-core = { path = "../../crates/openpixel-core" }
openpixel-jobs = { path = "../../crates/openpixel-jobs" }
# Phase 8: process isolation (timeout-kill + RSS enforcement) for
# convert / process / batch — the CLI re-execs itself as the
# hidden `__isolated-work` worker, supervised from this crate.
openpixel-security = { path = "../../crates/openpixel-security" }
# Studio Phase 2: PDF page ops + render (pdfium feature = dynamic
# libpdfium, loaded only when `pdf render` runs; every other pdf
# command works without it).
# Studio Phase 5: digital signatures (sign feature = pure-Rust
# PKCS#7/RSA; no system library, so no new platform burden).
openpixel-pdf = { path = "../../crates/openpixel-pdf", features = ["pdfium", "sign"] }
# Studio Phase 3: document conversion (LibreOffice headless +
# PDF text exports).
openpixel-documents = { path = "../../crates/openpixel-documents" }
# Studio Phase 4: native OCR (Tesseract). The binary links
# libtesseract + liblept dynamically — see docs/OCR.md for the
# runtime requirement (same honesty rule as libpdfium: the `ocr`
# commands fail with install instructions when it is missing).
openpixel-ocr = { path = "../../crates/openpixel-ocr", features = ["native-ocr"] }
openpixel-formats = { path = "../../crates/openpixel-formats" }
openpixel-api = { path = "../../crates/openpixel-api" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# Phase 6: `bench` generates its own fixtures with the `image`
# crate (pinned exact in the workspace, as elsewhere). The engine
# itself never depends on it at runtime for conversion.
image.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
