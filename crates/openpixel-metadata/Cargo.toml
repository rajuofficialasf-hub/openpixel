[package]
name = "openpixel-metadata"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenPixel Metadata — EXIF/ICC/XMP reading, metadata policies, orientation normalisation, animation frame info/extraction, ICC colour conversion (Phase 5)"

[dependencies]
openpixel-formats = { path = "../openpixel-formats" }
# `default-features = false`: must not re-enable the `native-avif`
# (dav1d) feature by unification when `openpixel-core` is built for
# wasm32 with `--no-default-features` — see `openpixel-codecs`.
openpixel-codecs = { path = "../openpixel-codecs", default-features = false }
openpixel-pipeline = { path = "../openpixel-pipeline" }
gif.workspace = true
tiff.workspace = true
flate2.workspace = true
tintbox.workspace = true
thiserror.workspace = true
serde.workspace = true

[dev-dependencies]
image.workspace = true
