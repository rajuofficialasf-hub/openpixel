[package]
name = "openpixel-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenPixel PDF engine — document detection, merge/split/page ops, PDFium render prototype (Studio Phase 1 foundation)"

[dependencies]
openpixel-core = { path = "../openpixel-core", default-features = false }
openpixel-formats = { path = "../openpixel-formats" }
crc32fast.workspace = true
flate2.workspace = true
image.workspace = true
# Feature activation only: lopdf -> rand -> getrandom 0.4 needs
# the `wasm_js` feature to compile for wasm32-unknown-unknown
# (getrandom is not supported on wasm32 by default). The feature
# is target-gated — a no-op on native targets — and this crate
# never calls getrandom directly. Without it the pdf crate cannot
# be part of the CI wasm32 check.
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
lopdf.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
image.workspace = true
tempfile = "=3.27.0"
# Self-signed test certificates for the signing tests (Phase 5).
rcgen.workspace = true
# RSA key generation for the test certificates (rcgen cannot
# generate RSA keys with its default ring backend).
rand = "=0.8.8"

[features]
default = []
# Native PDF rendering via PDFium (dynamic libpdfium binary — see
# LICENSE_AUDIT.md for provenance). Off by default: the prototype
# in examples/pdfium_render.rs enables it explicitly, and the
# `pdfium` test module is compiled only with this feature.
pdfium = ["dep:pdfium-render"]
# Digital signatures (PKCS#7 detached, RSA) — pure Rust, no system
# libraries. Off by default so the wasm32 build stays clean;
# the CLI enables it. Tests that need it are `#[cfg(feature =
# "sign")]`, like the pdfium tests.
sign = [
    "dep:cms",
    "dep:x509-cert",
    "dep:rsa",
    "dep:sha2",
    "dep:der",
    "dep:const-oid",
    "dep:signature",
    "dep:spki",
    "dep:pkcs8",
    "dep:pkcs1",
]

[dependencies.pdfium-render]
workspace = true
optional = true

[dependencies.cms]
workspace = true
optional = true
features = ["builder"]

[dependencies.x509-cert]
workspace = true
optional = true

[dependencies.rsa]
workspace = true
optional = true
# The `sha2` feature is what provides rsa's
# RsaSignatureAssociatedOid impl for Sha256 — without it,
# SigningKey::<Sha256>::new and VerifyingKey::<Sha256>::new do
# not compile.
features = ["sha2"]

[dependencies.sha2]
workspace = true
optional = true
# The `oid` feature is what makes rsa's SigningKey/VerifyingKey
# accept Sha256: it implements AssociatedOid for sha2's Oid types.
# Without it, SigningKey::<Sha256>::new does not compile.
features = ["oid"]

[dependencies.der]
workspace = true
optional = true

[dependencies.const-oid]
workspace = true
optional = true
features = ["db"]

[dependencies.signature]
workspace = true
optional = true

[dependencies.spki]
workspace = true
optional = true

[dependencies.pkcs8]
workspace = true
optional = true

[dependencies.pkcs1]
workspace = true
optional = true
