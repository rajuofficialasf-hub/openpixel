[package]
name = "openpixel-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenPixel processing pipeline — composable resize/crop/rotate/colour/watermark operations over DecodedImage (Phase 4)"

[dependencies]
# `default-features = false`: must not re-enable the `native-avif`
# (dav1d) feature by unification when `openpixel-core` is built for
# wasm32 with `--no-default-features` — see `openpixel-codecs`.
openpixel-codecs = { path = "../openpixel-codecs", default-features = false }
openpixel-formats = { path = "../openpixel-formats" }
image.workspace = true
thiserror.workspace = true
serde.workspace = true
