# Cargo configuration for the OpenPixel Engine workspace.
#
# dav1d (AVIF decode) is ALWAYS built from source and linked statically.
# Why: dav1d-sys's system_deps probe defaults to `never` for its internal
# build, so a machine with a system libdav1d installed links it
# dynamically — and then the shipped CLI/desktop binaries fail to start
# on any machine without that exact library (verified 16 Nov 2026: the
# Windows .msi/.exe and the Linux .deb all lacked dav1d, while the
# binaries import dav1d.dll / libdav1d.so.7). `always` makes the probe
# skip pkg-config entirely and build dav1d 1.5.0 from its vendored
# sources with meson (`-Ddefault_library=static`), so every build —
# local, CI, release — produces a self-contained binary.
#
# Build tools required for that vendored build (installed by
# scripts/setup/ubuntu-24.04.sh and by the CI workflow):
#   meson >= 0.49, ninja, nasm >= 2.14 (x86/x86_64 only), a C compiler,
#   and network access to code.videolan.org at build time (shallow clone).
# No system libdav1d is needed or used anymore.

[env]
SYSTEM_DEPS_DAV1D_BUILD_INTERNAL = { value = "always", force = true }
