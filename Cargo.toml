[workspace]
members = [
    "crates/openpixel-formats",
    "crates/openpixel-codecs",
    "crates/openpixel-core",
    "crates/openpixel-pipeline",
    "crates/openpixel-metadata",
    "crates/openpixel-jobs",
    "crates/openpixel-security",
    "crates/openpixel-api",
    "crates/openpixel-pdf",
    "crates/openpixel-documents",
    "crates/openpixel-ocr",
    "crates/openpixel-wasm",
    "apps/cli",
]
# Phase 9: the cargo-fuzz crate has its own workspace (it builds
# with nightly + libfuzzer-sys) and must not be picked up by
# `cargo test --workspace` / `cargo build --workspace`.
exclude = ["crates/openpixel-codecs/fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Phase 3: avif (ravif encode) + avif-native (dav1d decode, built
# from source and linked statically — see .cargo/config.toml;
# no system libdav1d is needed or used),
# hdr + exr (pure Rust, built into image-rs).
# WASM (follow-up item 2, 16 Nov 2026): `avif-native` is NOT in this
# list. The dav1d C library has no wasm32 build, so AVIF decode is
# opt-in through the `native-avif` cargo feature on
# `openpixel-codecs` (on by default for native builds, off for
# wasm32). `avif` (ravif encode, pure Rust) stays here; if a future
# wasm32 build shows ravif itself cannot compile, move it under the
# feature too — see docs/BUILD.md ("WASM").
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "bmp", "gif", "tiff", "webp", "tga", "ico", "pnm", "qoi", "avif", "hdr", "exr"] }
thiserror = "=2.0.21"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
clap = { version = "=4.6.7", features = ["derive"] }
# Phase 3 native codecs (pinned exact — see docs/CODECS.md):
# SVG rasterisation (pure Rust), JPEG XL (pure Rust decode + encode),
# JPEG 2000 (pure-Rust OpenJPEG port, no C library).
resvg = "=0.48.1"
usvg = "=0.48.1"
fontdb = "=0.24.0"
jxl-oxide = "=0.12.6"
zune-jpegxl = "=0.5.2"
zune-core = "=0.5.3"
jpeg2k = { version = "=0.11.0", default-features = false, features = ["image"] }
# HEIC/HEIF follow-up (16 Nov 2026, pinned exact — see docs/CODECS.md):
# heifer 0.5.1 is pure Rust (no C library, no libheif), MIT OR Apache-2.0,
# decode + encode. The libheif route was blocked: the VM's libheif1
# 1.23.3-1 has no matching -dev package and the system heif-enc ships
# no HEVC/AV1 encoder at all.
heifer = "=0.5.1"
# Phase 4 native OCR (pinned exact — see docs/OCR.md):
# tesseract-sys =0.6.3 is the MIT binding; Tesseract itself is
# Apache-2.0, Leptonica BSD-2-Clause. Native only, never WASM.
tesseract-sys = "=0.6.3"
# Phase 4: Leptonica C bindings (tesseract-sys re-exports nothing;
# the OCR crate calls pixReadMem/pixDestroy directly for the
# searchable-PDF path). BSD-2-Clause.
leptonica-sys = "=0.4.9"
# WASM bindings (follow-up item 2, 16 Nov 2026, pinned exact).
# wasm-pack reads the crate's wasm-bindgen version from the lockfile
# and fetches the matching wasm-bindgen CLI itself, so these pins
# only need to be mutually compatible (verified 16 Nov 2026:
# wasm-bindgen 0.2.130 + wasm-bindgen-test 0.3.80 + wasm-pack 0.15.1).
wasm-bindgen = "=0.2.130"
serde-wasm-bindgen = "=0.6.5"
# Phase 5 metadata & animation (pinned exact — see docs/CODECS.md):
# gif/tiff/flate2 were already transitive deps of image-rs 0.25.10
# at these exact versions; tintbox is a pure-Rust LittleCMS
# reimplementation (MIT) used for ICC -> sRGB colour conversion.
gif = "=0.14.2"
tiff = "=0.11.3"
flate2 = "=1.1.11"
# Studio Phase 3 — minimal ZIP writer for EPUB/DOCX export in
# openpixel-pdf (crc32fast is already a transitive dep of flate2
# at this exact version; it is pinned here as a direct dep).
crc32fast = "=1.5.5"
tintbox = "=0.5.0"
# Studio Phase 1 — PDF engine (pinned exact — see
# docs/EXISTING_PROJECT_AUDIT.md §14 and LICENSE_AUDIT.md):
# lopdf 0.47.0 is pure Rust (MIT), the manipulation library for
# merge/split/pages/metadata. pdfium-render 0.9.5 is the Rust
# binding (MIT OR Apache-2.0) to PDFium (BSD-3-Clause) for native
# PDF rendering / text extraction — it needs a libpdfium binary
# (dynamic link, never static), which is NOT in this workspace
# build by default: it is an optional dependency of
# `openpixel-pdf` behind the `pdfium` feature, used by the
# prototype in `crates/openpixel-pdf/examples/pdfium_render.rs`.
lopdf = "=0.47.0"
pdfium-render = "=0.9.5"
# Studio Phase 5 — digital signatures, pure Rust (all MIT OR
# Apache-2.0, no system libraries, no new platform burden):
# `cms` builds/verifies PKCS#7 SignedData, `x509-cert` parses
# certificates, `rsa` does RSA PKCS#1 v1.5 sign/verify,
# `rcgen` generates the self-signed test certificates (dev-only).
# `sha2` 0.10 is the version cms 0.2.3's builder uses (the tree
# also has sha2 0.11 elsewhere — two majors coexist fine);
# `der`/`const-oid`/`signature` are the ASN.1/OID/trait crates
# the signing code uses directly. `rsa` is pinned to 0.9.6 (not
# 0.9.0) because cms's builder requires rsa ^0.9.6. All seven
# are optional behind the `sign` feature of `openpixel-pdf`
# (the CLI enables it; the WASM build does not — signatures
# stay CLI/desktop-only, see docs/PDF.md).
cms = "=0.2.3"
x509-cert = "=0.2.5"
rsa = "=0.9.6"
rcgen = "=0.13.0"
sha2 = "=0.10.9"
der = "=0.7.10"
const-oid = "=0.9.6"
signature = "=2.2.0"
# spki 0.7.3 is the crate cms 0.2.3 uses for
# AlgorithmIdentifierOwned / DecodePublicKey (the signing code
# needs both directly).
spki = "=0.7.3"
# pkcs8/pkcs1 are the traits rsa's PEM/DER key parsing lives
# behind (DecodePrivateKey / DecodeRsaPrivateKey); both are
# already in the lockfile as transitive deps.
pkcs8 = "=0.10.2"
pkcs1 = "=0.7.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
