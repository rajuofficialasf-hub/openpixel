[workspace]
members = [
    "crates/openpixel-formats",
    "crates/openpixel-codecs",
    "crates/openpixel-core",
    "apps/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp", "gif", "tiff", "webp", "tga", "ico", "pnm", "qoi"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
