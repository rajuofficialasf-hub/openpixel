# cargo-deny configuration — Studio Phase 1.
#
# Purpose: keep copyleft licences out of the tree. AGPL is a hard
# no (master prompt); GPL and LGPL are excluded too, because a
# statically-linked Rust binary cannot practically satisfy their
# source-distribution terms for a desktop/CLI product.
#
# cargo-deny 0.21 has no deny-list: the check is an ALLOW list
# (anything not listed fails). The list below is the full set of
# licences present in the workspace (from the SBOM inventory plus
# the Phase 1 additions: lopdf MIT, pdfium-render MIT OR
# Apache-2.0). Two crates carry an LGPL *alternative* inside an
# OR expression (`MIT OR Apache-2.0 OR LGPL-2.1-or-later`) — those
# pass because MIT is allowed, and the LGPL alternative is never
# the operative licence. No crate in the tree is licensed under a
# copyleft licence alone.
#
# If a new dependency needs a licence that is not listed here,
# stop and bring the choice to Raju instead of editing this file
# — and never add a copyleft licence to the list.
#
# Run locally: cargo deny check licenses
# CI: .github/workflows/release.yml, job "wasm-and-licenses".

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Crates whose licence metadata cargo-deny cannot read are
# listed here only after a human has verified the actual
# licence in the crate source. (Empty for now.)
exceptions = []
