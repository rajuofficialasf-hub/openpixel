# Build + test OpenPixel Engine on Linux, Windows and macOS.
#
# What this does (and does NOT do):
# - Builds the CLI (cargo test --workspace + cargo build --release)
#   and the Tauri desktop app (npm run tauri build) on all three OSes.
# - Uploads the resulting binaries / installers as workflow artifacts
#   (actions/upload-artifact). Nothing is published: there is no
#   release-creation step, no upload to any store, no deploy.
# - This workflow first ran 16 Nov 2026 (run 43832448184): Linux and
#   macOS jobs all passed; both Windows jobs failed on missing
#   pkg-config for dav1d-sys — fixed by installing pkgconfiglite
#   (see the Windows dav1d steps).
# - 16 Nov 2026: dav1d is built from source and linked STATICALLY
#   (SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=always, .cargo/config.toml).
#   The old dynamic-link route (vcpkg / Homebrew / apt libdav1d) made
#   the shipped binaries fail to start without the library — the
#   Windows installers did not even contain dav1d.dll (verified by
#   inspecting the run 43842730311 artifact). The per-OS steps below
#   now install only the dav1d *build tools* (meson, ninja, nasm);
#   no system libdav1d is installed or used anywhere.
#
# Triggers: pushes and PRs to main, plus manual dispatch.
# Concurrency: one run per ref; a newer push cancels the older run.

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.100.0"
  NODE_VERSION: "24"
  # dav1d (AVIF decode) is always built from source and linked
  # statically — see .cargo/config.toml for why. dav1d-sys's
  # system_deps probe defaults to never building internally, so
  # without this the build would link a system libdav1d dynamically
  # (or fail outright when none is installed).
  SYSTEM_DEPS_DAV1D_BUILD_INTERNAL: "always"

jobs:
  # ---------------------------------------------------------------- CLI
  # Engine + CLI on all three OSes. The only system tooling the engine
  # build needs is meson + ninja + nasm, to build dav1d from source
  # (static) — see the per-OS steps below.
  cli:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary: openpixel
          - os: windows-latest
            binary: openpixel.exe
          - os: macos-latest
            binary: openpixel
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # --- Linux: meson + ninja + nasm build dav1d 1.5.0 from its
      # vendored sources (dav1d-sys build.rs clones
      # code.videolan.org/videolan/dav1d.git). nasm >= 2.14 is
      # required for the x86_64 assembly; Ubuntu 24.04 ships
      # meson 1.5.1, ninja 1.11.1, nasm 2.16.01.
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm pkg-config

      # --- Windows: dav1d is built from source and linked statically,
      # so NO vcpkg dav1d, NO pkg-config and NO DLL-on-PATH are needed
      # anymore. The vendored build needs meson + ninja + nasm
      # (x86_64 asm, nasm >= 2.14) and MSVC (preinstalled on
      # windows-latest; meson finds it via vswhere).
      # History — the old dynamic-link traps, all gone now:
      #  1. vcpkg provides NO pkg-config binary (run 43832448184).
      #  2. ${{ env.VCPKG_INSTALLATION_ROOT }} renders empty in
      #     workflow expressions (run 43835712580).
      #  3. the vcpkg DLL was not on PATH, so the binary died at load
      #     time (run 43837637514) — and the shipped installers lacked
      #     dav1d.dll entirely (verified 16 Nov 2026).
      - name: Install dav1d build tools (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm meson ninja -y

      # --- macOS: dav1d is built from source (static), so Homebrew
      # only provides the build tools. No gas-preprocessor needed:
      # dav1d's meson build needs it only for MSVC/ARM64, not clang.
      # Xcode Command Line Tools (C compiler) are preinstalled on
      # macos-latest.
      - name: Install dav1d build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja nasm pkg-config

      - name: Check formatting (Linux only)
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy (Linux only)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Build release CLI
        run: cargo build --release

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: openpixel-cli-${{ runner.os }}-${{ runner.arch }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------- Desktop
  # Tauri desktop app (apps/desktop). Needs the same dav1d build tools
  # as the CLI plus each platform's Tauri prerequisites:
  # - Linux: WebKitGTK/GTK -dev packages (standard apt install on a
  #   clean runner — no sysroot workaround needed here).
  # - Windows: WebView2 runtime is preinstalled on windows-latest.
  # - macOS: Xcode CLT preinstalled; bundle targets dmg/app need an
  #   .icns icon (apps/desktop/src-tauri/icons/icon.icns).
  # Build command is the repo's own script: "tauri": "tauri" in
  # apps/desktop/package.json, i.e. `npm run tauri build`.
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: one pattern per line — brace expansion {a,b} is NOT
          # expanded by actions/upload-artifact. Run 43840542449
          # proved it: both Windows installers existed
          # (bundle/msi/OpenPixel_0.1.0_x64_en-US.msi 8.68 MiB and
          # bundle/nsis/OpenPixel_0.1.0_x64-setup.exe 5.95 MiB) yet
          # the single pattern **/*.{msi,exe} matched NOTHING and
          # the step "succeeded" with if-no-files-found: warn, so
          # no desktop artifact was uploaded on any OS.
          - os: ubuntu-24.04
            bundle-glob: |
              apps/desktop/src-tauri/target/release/bundle/**/*.deb
              apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
          - os: windows-latest
            bundle-glob: |
              apps/desktop/src-tauri/target/release/bundle/**/*.msi
              apps/desktop/src-tauri/target/release/bundle/**/*.exe
          - os: macos-latest
            bundle-glob: |
              apps/desktop/src-tauri/target/release/bundle/**/*.dmg
              apps/desktop/src-tauri/target/release/bundle/**/*.app
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # --- Linux: standard Tauri 2 prerequisites (see docs/DESKTOP.md
      # "System libraries"). No sysroot workaround on a clean runner.
      # meson + ninja + nasm are the dav1d source-build tools (same
      # as the CLI job); pkg-config is preinstalled on the runner.
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev

      # --- Windows: dav1d is built from source (static) — see the
      # CLI job's note. No vcpkg, no pkg-config, no DLL handling.
      - name: Install dav1d build tools (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm meson ninja -y

      # --- macOS: dav1d is built from source (static) — see the
      # CLI job's note.
      - name: Install dav1d build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja nasm pkg-config

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      - name: Test frontend
        working-directory: apps/desktop
        run: npm test

      # NOTE (Linux): the .AppImage step needs FUSE at bundle time;
      # on this VM it was produced by hand with linuxdeploy (see
      # docs/DESKTOP.md). If the runner lacks FUSE the AppImage
      # bundle may fail while the .deb succeeds — that is a known
      # open item, not a silent pass: the step fails loudly.
      - name: Build desktop installers
        working-directory: apps/desktop
        run: npm run tauri build

      # warn (not error) if a bundle is missing: the build step above
      # is the real gate; a missing AppImage on a FUSE-less runner
      # must not hide a successful .deb.
      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: openpixel-desktop-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.bundle-glob }}
          if-no-files-found: warn
          retention-days: 30

  # ----------------------------------------------------------------- Web
  # Web app (apps/web): unit tests + production build, Linux only —
  # the web app has no platform-specific output.
  web:
    name: Web (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend deps
        working-directory: apps/web
        run: npm ci

      - name: Test
        working-directory: apps/web
        run: npm test

      - name: Build
        working-directory: apps/web
        run: npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: openpixel-web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 30
